name: Build Web PWA, Android APK & Auto-Version Release

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'package.json'
      - 'public/version.json'
      - 'android/app/build.gradle'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version increment type (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 (for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: TypeScript Lint Check
        run: npm run lint

      - name: Verify Initial Web/PWA Build
        run: npm run build

      - name: Bump App Version & Update version.json
        id: bump
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump || 'patch' }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          node scripts/bump-version.mjs --${BUMP_TYPE}
          NEW_VER=$(node -p "require('./package.json').version")
          echo "version=${NEW_VER}" >> "$GITHUB_OUTPUT"

      - name: Build Production Web/PWA Bundle with New Version
        run: npm run build

      - name: Sync Capacitor & Build Android APK
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Package Web Dist & Android APK Artifacts
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-artifacts/Dashboard-EV-v${{ steps.bump.outputs.version }}.apk"
          cd dist
          zip -r "../release-artifacts/dashboard-app-v${{ steps.bump.outputs.version }}.zip" .

      - name: Commit Version Bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json public/version.json
          if [ -f android/app/build.gradle ]; then
            git add android/app/build.gradle
          fi
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git push

      - name: Create Git Tag & GitHub Release (PWA + Android APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: Dashboard EV v${{ steps.bump.outputs.version }}
          generate_release_notes: true
          files: |
            release-artifacts/Dashboard-EV-v${{ steps.bump.outputs.version }}.apk
            release-artifacts/dashboard-app-v${{ steps.bump.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
